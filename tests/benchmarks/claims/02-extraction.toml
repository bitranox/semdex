# ---------------------------------------------------------------- OCR on degraded scans

[[claim]]
id = "extraction-ocr-best-pass-rate"
quote = "Even the best engine passes 44 percent of the content tests"
published = "44"
rows = "ocr"
reduce = "max"
field = "content_pass"
where = { kind = ["vlm", "incumbent"] }
scale = 100
why = "the highest content pass rate across every engine scored on the old-scans split (olmocr, 0.437)"
