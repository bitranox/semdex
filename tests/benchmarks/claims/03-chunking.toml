where = { axis = "overlap_tokens", corpus = "mldr_de_3k_slice", embedding = "ollama:qwen3-embedding-4b", "held_fixed.strategy" = "recursive", "held_fixed.max_tokens" = 512, from_level = 0, to_level = 10 }
