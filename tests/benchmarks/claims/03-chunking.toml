reduce = "value"
field = "mean_delta"
where = { axis = "overlap_tokens", corpus = "mldr_de_3k_slice", embedding = "fastembed:bge-base", "held_fixed.strategy" = "recursive", "held_fixed.max_tokens" = 512, from_level = 10, to_level = 15 }
why = "the one cap512 overlap comparison on MLDR that resolves; the checker orients every pair low to high"


[[claim]]
