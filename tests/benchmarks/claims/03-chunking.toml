# Every figure quoted in the PROSE of docs/benchmarks/03-chunking.md, paired with the derivation
# that reproduces it from tests/benchmarks/raw/*.json. Checked by scripts/check_bench_claims.py and
# gated by tests/test_bench_claims_current.py. The format is documented in README.md beside this
# file; the short version is: quote the sentence, print the figure exactly as the page prints it,
# and say which rows are reduced how.

doc = "docs/benchmarks/03-chunking.md"

[sets]
# The corpora whose documents are long enough to carry a chunking claim. gen_bench_tables applies
# the same filter to every chunking table, so a claim about a headline count has to apply it too.
fit_corpora = ["gerdalir_de_12k_slice", "mldr_de_3k_slice", "mldr_en_8k_slice"]
mldr = ["mldr_de_3k_slice", "mldr_en_8k_slice"]
resplitters = ["markdown", "fast"]
# The plain semantic profiles, cut with chonkie's default breakpoint model. The exporter stores that
# level as null, which a TOML filter cannot name, so a claim about the default names the cells.
default_breakpoint_cells = [
  "mldr_de_3k_slice__semantic-t256-o0-gpt2__ollama-qwen3-embedding-4b",
  "mldr_de_3k_slice__semantic-t512-o0-gpt2__ollama-qwen3-embedding-4b",
  "mldr_de_3k_slice__semantic-t256-o0-gpt2__ollama-qwen3-embedding-8b",
  "mldr_de_3k_slice__semantic-t512-o0-gpt2__ollama-qwen3-embedding-8b",
  "mldr_en_8k_slice__semantic-t256-o0-gpt2__ollama-qwen3-embedding-4b",
  "mldr_en_8k_slice__semantic-t512-o0-gpt2__ollama-qwen3-embedding-4b",
  "mldr_en_8k_slice__semantic-t256-o0-gpt2__ollama-qwen3-embedding-8b",
  "mldr_en_8k_slice__semantic-t512-o0-gpt2__ollama-qwen3-embedding-8b",
  "mldr_en_8k_slice__semantic-t256-o0-gpt2__ollama-bge-m3",
]

[rowsets.effects]
source = "chunk-knob-effects.json"
path = "effects"
orient = true

[rowsets.chunk_sets]
source = "chunk-dimension-audit.json"
path = "chunk_sets"

[rowsets.span_integrity]
source = "span-integrity.json"
path = "integrity"

[rowsets.span_retrieval]
source = "span-integrity.json"
path = "retrieval"

[rowsets.throughput]
source = "chunker-throughput.json"
path = "rows"

[rowsets.gpu_embedding]
source = "embedding-qwen3-gpu.json"

[rowsets.embedder_truncation]
source = "embedder-truncation-audit.json"
path = "rows"

# ---------------------------------------------------------------- which corpora, and how big

[[claim]]
id = "mldr-en-chunks-per-doc"
quote = "MLDR English (18.5 chunks"
published = "18.5"
rows = "chunk_sets"
reduce = "value"
field = "chunks_per_doc"
where = { corpus = "mldr_en_8k_slice", profile = "recursive-t256-o0-gpt2" }
why = "chunks per document on the reference profile the fitness filter judges a corpus on"

[[claim]]
id = "mldr-en-queries"
quote = "per document, 800 queries)"
published = "800"
rows = "chunk_sets"
reduce = "value"
field = "n_queries"
where = { corpus = "mldr_en_8k_slice", profile = "recursive-t256-o0-gpt2" }
why = "the query count the corpus was scored with"

[[claim]]
