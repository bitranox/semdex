# ---------------------------------------------------------------- the headline

[[claim]]
id = "headline-max-tokens-resolved"
quote = "resolves in 109 of its 152 comparisons"
published = "109"
rows = "effects"
reduce = "count"
where = { axis = "max_tokens", resolved = true, corpus = "@fit_corpora" }
why = "resolved chunk-size comparisons on the corpora that can carry a chunking claim"

[[claim]]
id = "headline-whitespace-losses"
quote = "loses all 21 of the comparisons that resolve against it"
published = "21"
rows = "effects"
reduce = "count"
where = { axis = "strategy", resolved = true, unfavoured_level = "whitespace", corpus = "@fit_corpora" }
why = "resolved strategy comparisons whose losing side is whitespace"

[[claim]]
id = "headline-mldr-overlap-downward"
quote = "22 of the 34 that resolve favour LESS"
published = "22"
rows = "effects"
reduce = "count"
where = { axis = "overlap_tokens", resolved = true, corpus = "@mldr", favoured_end = "low" }
why = "resolved MLDR overlap comparisons favouring the LOWER level, both languages; re-pointed to the per-comparison bullet below, since the paragraph above now judges ladders end to end"

[[claim]]
id = "headline-mldr-overlap-resolved"
quote = "22 of the 34 that resolve favour LESS"
published = "34"
rows = "effects"
reduce = "count"
where = { axis = "overlap_tokens", resolved = true, corpus = "@mldr" }
why = "every resolved MLDR overlap comparison, whichever way it fell; re-pointed alongside headline-mldr-overlap-downward"

[[claim]]
id = "headline-overlap-chance-basis"
quote = "Of the 530 overlap comparisons that resolve"
published = "530"
rows = "effects"
reduce = "count"
where = { axis = "overlap_tokens", resolved = true, corpus = "@fit_corpora" }
why = "resolved overlap comparisons, the basis the chance ceiling and the material floor both apply to"

[[claim]]
id = "headline-overlap-material-floor"
quote = "136 sit under the half-point material floor"
published = "136"
rows = "effects"
reduce = "count"
where = { axis = "overlap_tokens", resolved = true, material = false, corpus = "@fit_corpora" }
why = "resolved overlap comparisons that fall under the 0.005 nDCG@10 material floor"

[[claim]]
id = "headline-strategy-material-floor"
quote = "The strategy axis loses 5 comparisons to that floor"
published = "5"
rows = "effects"
reduce = "count"
where = { axis = "strategy", resolved = true, material = false, corpus = "@fit_corpora" }
why = "resolved strategy comparisons that fall under the material floor"

[[claim]]
id = "headline-size-material-floor"
quote = "and the size axis loses 3"
published = "3"
rows = "effects"
reduce = "count"
where = { axis = "max_tokens", resolved = true, material = false, corpus = "@fit_corpora" }
why = "resolved chunk-size comparisons that fall under the material floor"

[[claim]]
id = "headline-gerdalir-overlap-ladders-more-128"
quote = "four top out at 128 tokens"
published = "four"
rows = "effects"
reduce = "count"
where = { axis = "overlap_tokens", corpus = "gerdalir_de_12k_slice", "held_fixed.strategy" = "recursive", "held_fixed.max_tokens" = 256, from_level = 0, to_level = 128, material = true, favoured_end = "high", embedding = ["fastembed:bge-base", "ollama:bge-m3", "ollama:qwen3-embedding-4b", "ollama:qwen3-embedding-8b"] }
why = "GerDaLIR's four recursive cap256 ladders whose own top is 128 tokens, each material and favouring more at that top; restricted to those four embedders because the other two (model2vec) also carry a 0-to-128 row as an intermediate rung on their way to 256, which would otherwise double count"

[[claim]]
id = "headline-gerdalir-overlap-ladders-more-128-guard"
quote = "four top out at 128 tokens"
published = "128"
rows = "effects"
reduce = "max"
field = "to_level"
where = { axis = "overlap_tokens", corpus = "gerdalir_de_12k_slice", "held_fixed.strategy" = "recursive", "held_fixed.max_tokens" = 256, embedding = ["fastembed:bge-base", "ollama:bge-m3", "ollama:qwen3-embedding-4b", "ollama:qwen3-embedding-8b"] }
why = "guards headline-gerdalir-overlap-ladders-more-128: that claim's embedding allowlist counts four rows but cannot notice if one of those four later gains a rung above 128; this pins the highest to_level any comparison of theirs ever reaches at exactly 128, over all 180 of their recursive cap256 overlap comparisons, so a rung added above 128 fails here rather than silently changing what 'four' counts"

[[claim]]
id = "headline-gerdalir-overlap-ladders-more-256"
quote = "two, both `model2vec`, run to 256"
published = "two"
rows = "effects"
reduce = "count"
where = { axis = "overlap_tokens", corpus = "gerdalir_de_12k_slice", "held_fixed.strategy" = "recursive", "held_fixed.max_tokens" = 256, from_level = 0, to_level = 256, material = true, favoured_end = "high" }
why = "the two model2vec embedders whose recursive cap256 sweep runs all the way to 256 tokens; only they carry a 0-to-256 row, so to_level=256 selects exactly them"

[[claim]]
id = "headline-gerdalir-overlap-ladders-undecided-hint"
quote = "Its other twelve ladders"
published = "twelve"
rows = "effects"
reduce = "count"
where = { axis = "overlap_tokens", corpus = "gerdalir_de_12k_slice", "held_fixed.strategy" = ["fast", "markdown"], "held_fixed.max_tokens" = 256, from_level = 0, to_level = 51 }
why = "the six embedders on each of the fast and markdown resplitters, whose two-rung ladder tops out at 51 tokens; none is material, per the summary table's ladder verdict"

[[claim]]
id = "headline-mldr-overlap-ladders-less-cap256"
quote = "three of its `recursive` cap256 ladders"
published = "three"
rows = "effects"
reduce = "count"
where = { axis = "overlap_tokens", corpus = "mldr_en_8k_slice", "held_fixed.strategy" = "recursive", "held_fixed.max_tokens" = 256, from_level = 0, to_level = 51, material = true, favoured_end = "low" }
why = "MLDR English's recursive cap256 ladders whose own top is 51 tokens (bge-base, potion-retrieval-32M, bge-m3), material and favouring less; bge-small's own top for this held-fixed set is 15, a different ladder claimed separately"

[[claim]]
id = "headline-mldr-overlap-ladders-less-cap512"
quote = "one of its cap512 ladders"
published = "one"
rows = "effects"
reduce = "count"
where = { axis = "overlap_tokens", corpus = "mldr_en_8k_slice", "held_fixed.strategy" = "recursive", "held_fixed.max_tokens" = 512, from_level = 0, to_level = 15, material = true, favoured_end = "low" }
why = "MLDR English's cap512 ladders, all topping at 15 tokens; only qwen3-embedding-4b is material and favours less there"

[[claim]]
id = "headline-mldr-overlap-ladders-more-hint256"
quote = "three of its two-rung `fast` and `markdown`"
published = "three"
rows = "effects"
reduce = "count"
where = { axis = "overlap_tokens", corpus = "@mldr", from_level = 0, to_level = 51, material = true, favoured_end = "high" }
why = "every MLDR ladder tops at either 15 or 51 tokens, so to_level=51 alone selects exactly the fast/markdown/recursive cap256 groups across both languages; the three material-and-more rows here are all fast or markdown (potion-base-8M twice on English, bge-m3 once on German), none is recursive. That last part is contingent, not structural: the filter above also admits recursive cap256 rows at this rung, and today none of them is material-and-more, but no sentence in the prose states that zero so the claims checker (which requires a claim's published figure to appear literally in its own quote) cannot pin it with a companion guard here; a future recursive row crossing the floor upward would silently fold into 'three' and this claim would still pass"


[[claim]]
id = "mldr-cap512-overlap-comparisons"
quote = "and of their 36 overlap comparisons four resolve"
published = "36"
rows = "effects"
reduce = "count"
where = { axis = "overlap_tokens", corpus = "@mldr", "held_fixed.max_tokens" = 512 }
why = "the overlap comparisons the four re-measured cap512 sets supply on the two MLDR corpora"

[[claim]]
