[[claim]]
id = "mldr-cap512-qwen3-en-o15"
quote = "(0 against 10 tokens, -0.0059; 0 against 15, -0.0052)"
published = "-0.0052"
rows = "effects"
reduce = "value"
field = "mean_delta"
where = { axis = "overlap_tokens", corpus = "mldr_en_8k_slice", embedding = "ollama:qwen3-embedding-4b", "held_fixed.strategy" = "recursive", "held_fixed.max_tokens" = 512, from_level = 0, to_level = 15 }
