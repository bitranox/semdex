rows = "effects"
reduce = "value"
field = "mean_delta"
where = { axis = "overlap_tokens", corpus = "mldr_en_8k_slice", embedding = "ollama:qwen3-embedding-4b", "held_fixed.strategy" = "recursive", "held_fixed.max_tokens" = 512, from_level = 0, to_level = 10 }
