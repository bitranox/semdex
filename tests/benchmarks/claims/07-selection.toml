# Claims for docs/benchmarks/07-selection.md
#
# Coverage is partial and is answered by reading this file beside the page, never by a green run.
# Seeded: the "spend your effort in this order" list, the stacks' dimensions and the ANN, OCR,
# model2vec-speed, energy, cloud-price and idle-draw figures, and the reranker warning. Carried by
# prose the checker cannot express: "three embedders reverse" at 20-word queries (a count needs a
# sign filter), "leads on both languages" and "comes last on German" (rankings; the generated
# table on 04-embedding.md carries them), "barely half the exact top ten" for lancedb's fast
# preset (no figure printed; the frontier table on 05-vector-store.md carries it), the
# 2000-dimension pgvector index cap (a product limit, not a measurement), and "above about
# 100,000 chunks" (the shipped lance_index_threshold, a config default; both crossover ladders in
# the raw ran at 10,000, so no raw file carries the figure).

doc = "docs/benchmarks/07-selection.md"

[sets]
# The corpora whose documents are long enough to carry a chunking claim, per
# chunk-dimension-audit.json. The same set the generated summary table is restricted to.
fit_corpora = ["gerdalir_de_12k_slice", "mldr_de_3k_slice", "mldr_en_8k_slice"]
chunk_axes = ["max_tokens", "overlap_tokens", "strategy"]

[rowsets.effects]
source = "chunk-knob-effects.json"
path = "effects"
orient = true

[rowsets.qlen_bins]
source = "query-length-effect.json"
path = "by_query_length_bins"

[rowsets.chunk_sets]
source = "chunk-dimension-audit.json"
path = "chunk_sets"

[rowsets.qlen_causal]
source = "query-length-effect.json"
path = "truncated_queries"

[rowsets.mldr_cells]
source = "chunk-sweep-mldr.json"
path = "cells"

[rowsets.multilingual_cells]
source = "embedding-multilingual-mldr.json"
path = "cells"

[rowsets.ocr]
source = "ocr-badscans.json"
path = "results"

[rowsets.store_quality]
source = "store-quality.json"
path = "cells"

[rowsets.energy_cpu]
source = "energy.json"
path = "rows"

[rowsets.energy_gpu]
source = "energy-gpu.json"
path = "rows"

[rowsets.cloud]
source = "cloud-prices.json"
path = "providers"

# One record: the sample the per-document cloud prices were converted on.
[rowsets.cloud_sample]
source = "cloud-prices.json"
path = "tokens_per_document"

# ---------------------------------------------------------------- 1. add lexical retrieval

[[claim]]
id = "selection-dense-to-hybrid-comparisons"
quote = "of the ten dense-to-hybrid comparisons, nine resolve and every resolved one is"
published = "ten"
rows = "effects"
reduce = "count"
where = { axis = "method", from_level = "dense", to_level = "hybrid" }
why = "the single dense-to-hybrid level pair on the method axis, over both corpora and all five embedders; NOT the whole method row, which crosses all nine retrieval levels pairwise"

[[claim]]
id = "selection-dense-to-hybrid-resolved"
quote = "of the ten dense-to-hybrid comparisons, nine resolve and every resolved one is"
published = "nine"
rows = "effects"
reduce = "count"
where = { axis = "method", from_level = "dense", to_level = "hybrid", resolved = true }
why = "how many of those ten separate at 95 percent"

[[claim]]
id = "selection-dense-to-hybrid-largest"
quote = "up to +0.249 nDCG@10 against roughly 0.16 for the best chunking knob"
published = "+0.249"
rows = "effects"
reduce = "max"
field = "mean_delta"
where = { axis = "method", from_level = "dense", to_level = "hybrid", resolved = true }
why = "the largest resolved dense-to-hybrid gain, oriented dense to hybrid so the sign reads as fusion's margin"

[[claim]]
id = "selection-best-chunking-knob-for-contrast"
quote = "up to +0.249 nDCG@10 against roughly 0.16 for the best chunking knob"
published = "0.16"
rows = "effects"
reduce = "max"
field = "mean_delta"
transform = "abs"
where = { axis = "@chunk_axes", resolved = true, corpus = "@fit_corpora" }
why = "the largest resolved effect any chunking knob produces, which is what the fusion figure is being held against; unsigned, because the comparison is of magnitude"

[[claim]]
id = "selection-method-row-comparisons"
quote = "one level pair inside the 154 on the `method` row above, which crosses all nine retrieval"
published = "154"
rows = "effects"
reduce = "count"
where = { axis = "method" }
why = "every method-axis comparison, the figure the generated summary table prints on that row"

# ---------------------------------------------------------------- 7. overlap

[[claim]]
id = "selection-overlap-short-query-cost"
quote = "questions: 0, it costs the default embedder a resolved 0.02 nDCG@10"
published = "0.02"
rows = "qlen_bins"
reduce = "value"
field = "mean_delta"
transform = "abs"
where = { corpus = "gerdalir_de_12k_slice", overlap_high = 128, bin = "Q1", embedding = "fastembed:bge-base" }
why = "bge-base's loss from 128 tokens of overlap on GerDaLIR's shortest-quarter queries"

[[claim]]
id = "selection-overlap-passage-gain-bge-base"
quote = "25 to 30 percent of the cap, worth +0.005 (`bge-base`) to +0.023 (static models) on GerDaLIR"
published = "+0.005"
rows = "effects"
reduce = "value"
field = "mean_delta"
where = { axis = "overlap_tokens", corpus = "gerdalir_de_12k_slice", "held_fixed.strategy" = "recursive", "held_fixed.max_tokens" = 256, from_level = 0, to_level = 77, embedding = "fastembed:bge-base" }
why = "the default embedder's gain from 0 to 77 tokens, 30 percent of the cap"

[[claim]]
id = "selection-overlap-passage-gain-static"
quote = "25 to 30 percent of the cap, worth +0.005 (`bge-base`) to +0.023 (static models) on GerDaLIR"
published = "+0.023"
rows = "effects"
reduce = "max"
field = "mean_delta"
where = { axis = "overlap_tokens", corpus = "gerdalir_de_12k_slice", "held_fixed.strategy" = "recursive", "held_fixed.max_tokens" = 256, from_level = 0, to_level = 77, embedding = ["model2vec:potion-base-8M", "model2vec:potion-retrieval-32M"] }
why = "the larger static model's gain from 0 to 77 tokens"

[[claim]]
id = "selection-semantic-fragment-median"
quote = "where its 46-token fragments face 461-token chunks"
published = "46"
rows = "chunk_sets"
reduce = "value"
field = "token_p50"
where = { corpus = "mldr_en_8k_slice", profile = "semantic-t256-o0-gpt2" }
why = "semantic's realized median chunk on MLDR English"

[[claim]]
id = "selection-recursive-512-median"
quote = "where its 46-token fragments face 461-token chunks"
published = "461"
rows = "chunk_sets"
reduce = "value"
field = "token_p50"
where = { corpus = "mldr_en_8k_slice", profile = "recursive-t512-o0-gpt2" }
why = "recursive's realized median at cap512 on MLDR English"

# ---------------------------------------------------------------- the reranker warning

[[claim]]
id = "selection-rerank-comparisons"
quote = "Do not add a cross-encoder reranker on faith. Of the twelve comparisons measured here, eight"
published = "twelve"
rows = "effects"
reduce = "count"
where = { axis = "method", to_level = { field = "from_level", suffix = "+rerank" } }
why = "each base method against its OWN reranked variant, which is the relation the sentence counts; enumerating the three bases and the three rerank levels as two lists instead takes the cross product and matches nine pairs"

[[claim]]
id = "selection-rerank-resolved"
quote = "Do not add a cross-encoder reranker on faith. Of the twelve comparisons measured here, eight"
published = "eight"
rows = "effects"
reduce = "count"
where = { axis = "method", to_level = { field = "from_level", suffix = "+rerank" }, resolved = true }
why = "how many of those twelve separate at 95 percent. That every one of the eight is NEGATIVE is not claimable here - the filter has no numeric comparison - and is carried by the generated table on 06-retrieval-method.md, which lists all twelve with their intervals"

# ---------------------------------------------------------------- 2. the embedding model

[[claim]]
id = "selection-embedding-largest-effect"
quote = "the largest resolved one is 0.51 nDCG@10, about three times the 0.16"
published = "0.51"
rows = "effects"
reduce = "max"
field = "mean_delta"
transform = "abs"
where = { axis = "embedding", resolved = true, corpus = "@fit_corpora" }
why = "the largest resolved effect on the embedding axis over the corpora that can carry a chunking claim, unsigned because the sentence compares magnitudes; it is qwen3-8b against potion-base-8M on MLDR German"

[[claim]]
id = "selection-embedding-vs-best-chunking-knob"
quote = "the largest resolved one is 0.51 nDCG@10, about three times the 0.16"
published = "0.16"
rows = "effects"
reduce = "max"
field = "mean_delta"
transform = "abs"
where = { axis = "@chunk_axes", resolved = true, corpus = "@fit_corpora" }
why = "the largest resolved effect any chunking knob produces, the same figure item 1 holds fusion against; the ratio of the two maxima is 3.1, which no single reducer expresses, so the page prints both and says about three"

# ---------------------------------------------------------------- 3. chunk size

[[claim]]
id = "selection-gerdalir-smallest-rung"
quote = "every step from 64 up to 256, for every"
published = "64"
rows = "effects"
reduce = "min"
field = "from_level"
where = { axis = "max_tokens", corpus = "gerdalir_de_12k_slice", "held_fixed.strategy" = "recursive" }
why = "the lowest chunk-size rung on GerDaLIR; oriented rows put the lower level in from_level"

[[claim]]
id = "selection-gerdalir-largest-rung"
quote = "every step from 64 up to 256, for every"
published = "256"
rows = "effects"
reduce = "max"
field = "to_level"
where = { axis = "max_tokens", corpus = "gerdalir_de_12k_slice", "held_fixed.strategy" = "recursive" }
why = "the highest chunk-size rung on GerDaLIR"

[[claim]]
id = "selection-size-largest-effect"
quote = "embedder, by up to 0.158 nDCG@10"
published = "0.158"
rows = "effects"
reduce = "max"
field = "mean_delta"
transform = "abs"
where = { axis = "max_tokens", resolved = true, corpus = "gerdalir_de_12k_slice" }
why = "the largest resolved chunk-size effect on GerDaLIR, potion-base-8M from 64 up to 256"

# ---------------------------------------------------------------- 6. chunking strategy

[[claim]]
id = "selection-ws-256-words-english-ratio"
quote = "at 256 words, which hold 1.5 to 3 times the text of a 256-token chunk"
published = "1.5"
rows = "chunk_sets"
reduce = "ratio"
field = "chars_per_token"
against = { corpus = "mldr_en_8k_slice", profile = "recursive-t256-o0-gpt2" }
where = { corpus = "mldr_en_8k_slice", profile = "whitespace-t256-o0-gpt2" }
why = "text per whitespace word over text per gpt2 token on English, the chunking page's own derivation"

[[claim]]
id = "selection-ws-256-words-german-ratio"
quote = "at 256 words, which hold 1.5 to 3 times the text of a 256-token chunk"
published = "3"
rows = "chunk_sets"
reduce = "ratio"
field = "chars_per_token"
against = { corpus = "gerdalir_de_12k_slice", profile = "recursive-t256-o0-gpt2" }
where = { corpus = "gerdalir_de_12k_slice", profile = "whitespace-t256-o0-gpt2" }
why = "the same ratio on German, where gpt2 tokens are short"

# ---------------------------------------------------------------- 7. overlap, the cap fractions and the cut

[[claim]]
id = "selection-overlap-cap-fraction-low"
quote = "25 to 30 percent of the cap, worth +0.005"
published = "25"
rows = "effects"
reduce = "ratio"
field = "to_level"
against_field = "held_fixed.max_tokens"
scale = 100
where = { axis = "overlap_tokens", corpus = "gerdalir_de_12k_slice", "held_fixed.strategy" = "recursive", "held_fixed.max_tokens" = 256, from_level = 0, to_level = 64, embedding = "fastembed:bge-base" }
why = "64 tokens of overlap as a share of a 256-token cap, read off the ladder rung itself"

[[claim]]
id = "selection-overlap-cap-fraction-high"
quote = "25 to 30 percent of the cap, worth +0.005"
published = "30"
rows = "effects"
reduce = "ratio"
field = "to_level"
against_field = "held_fixed.max_tokens"
scale = 100
where = { axis = "overlap_tokens", corpus = "gerdalir_de_12k_slice", "held_fixed.strategy" = "recursive", "held_fixed.max_tokens" = 256, from_level = 0, to_level = 77, embedding = "fastembed:bge-base" }
why = "77 tokens of overlap as a share of a 256-token cap, the rung the gains in the same sentence are read at"

[[claim]]
id = "selection-query-cut-words"
quote = "cutting GerDaLIR's queries to 20 words"
published = "20"
rows = "qlen_causal"
reduce = "max"
field = "query_words"
where = { corpus = "gerdalir_de_12k_slice" }
why = "the one cut length the truncated-query re-score was run at; max because every row carries the same value"

# ---------------------------------------------------------------- the stacks

[[claim]]
id = "selection-bge-base-dimension"
quote = "768-dim; bge-small if memory is tight"
published = "768"
rows = "mldr_cells"
reduce = "max"
field = "dim"
where = { embedding = "fastembed:bge-base" }
why = "the dimension every bge-base cell was scored at; max because every cell carries the same value"

[[claim]]
id = "selection-bge-m3-dimension"
quote = "and `bge-m3` at 1024 is the cheapest of the three to store and search"
published = "1024"
rows = "multilingual_cells"
reduce = "max"
field = "dim"
where = { embedding = "ollama:bge-m3" }
why = "the dimension every bge-m3 cell was scored at"

[[claim]]
id = "selection-ocr-best-engine-pass-rate"
quote = "the best engine measured passes 44 percent of the content tests on"
published = "44"
rows = "ocr"
reduce = "max"
field = "content_pass"
scale = 100
where = { kind = ["vlm", "classic"] }
why = "the highest content-test pass rate of the five OCR engines on the degraded-scan split, as a percentage"

[[claim]]
id = "selection-ann-recall-floor"
quote = "keeps 0.96 to 0.99 of the exact top ten"
published = "0.96"
rows = "store_quality"
reduce = "min"
field = "doc_recall_at_k"
where = { ann_params = "nprobes=10 refine_factor=5" }
why = "the lowest document recall against the exact scan over the four ANN cells at the shipped setting"

[[claim]]
id = "selection-ann-recall-ceiling"
quote = "keeps 0.96 to 0.99 of the exact top ten"
published = "0.99"
rows = "store_quality"
reduce = "max"
field = "doc_recall_at_k"
where = { ann_params = "nprobes=10 refine_factor=5" }
why = "the highest of the same four"

[[claim]]
id = "selection-ann-ndcg-cost-ceiling"
quote = "costs between 0 and 1.1 percent of nDCG@10 for a"
published = "1.1"
rows = "store_quality"
reduce = "percent_change"
field = "ndcg@10"
against_field = "exact_ndcg@10"
scale = -1
where = { corpus = "mldr_de_3k_slice", embedding = "fastembed:bge-base", ann_params = "nprobes=10 refine_factor=5" }
why = "the largest of the four losses, ANN nDCG against the exact scan on the same vectors, sign flipped so the loss reads positive; the other three are 0.27, 0.06 and -0.08, which a pair reducer cannot rank across rows"

[[claim]]
id = "selection-ann-ndcg-cost-floor"
quote = "costs between 0 and 1.1 percent of nDCG@10 for a"
published = "0"
rows = "store_quality"
reduce = "percent_change"
field = "ndcg@10"
against_field = "exact_ndcg@10"
scale = -1
where = { corpus = "mldr_de_3k_slice", embedding = "ollama:qwen3-embedding-8b", ann_params = "nprobes=10 refine_factor=5" }
why = "the smallest of the four: the German 4096-dimensional cell scores 0.08 percent ABOVE the exact scan, which the page rounds to a cost of 0"

[[claim]]
id = "selection-ann-speedup-floor"
quote = "6.5 to 12 times speedup"
published = "6.5"
rows = "store_quality"
reduce = "ratio"
field = "search_p50_ms"
where = { corpus = "mldr_en_8k_slice", embedding = "fastembed:bge-base", ann_params = "driver default" }
against = { corpus = "mldr_en_8k_slice", embedding = "fastembed:bge-base", ann_params = "nprobes=10 refine_factor=5" }
why = "exact-scan p50 over ANN p50 on the cell where the gap is smallest, MLDR English at 768 dimensions"

[[claim]]
id = "selection-ann-speedup-ceiling"
quote = "6.5 to 12 times speedup"
published = "12"
rows = "store_quality"
reduce = "ratio"
field = "search_p50_ms"
where = { corpus = "mldr_de_3k_slice", embedding = "ollama:qwen3-embedding-8b", ann_params = "driver default" }
against = { corpus = "mldr_de_3k_slice", embedding = "ollama:qwen3-embedding-8b", ann_params = "nprobes=10 refine_factor=5" }
why = "the same ratio where the gap is largest, MLDR German at 4096 dimensions"

[[claim]]
id = "selection-model2vec-docs-per-second"
quote = "faster than fastembed on CPU, 12,065 against"
published = "12,065"
rows = "energy_cpu"
reduce = "value"
field = "docs_per_s"
where = { provider = "model2vec" }
why = "potion-base-8M's throughput in the energy run, on the same box and documents as the fastembed row"

[[claim]]
id = "selection-fastembed-docs-per-second"
quote = "12.3 documents per second in the energy measurement below"
published = "12.3"
rows = "energy_cpu"
reduce = "value"
field = "docs_per_s"
where = { provider = "fastembed" }
why = "bge-small's throughput in the same run; the ratio is 981, which the page rounds to a thousand"

# ---------------------------------------------------------------- what it costs to run

[[claim]]
id = "selection-energy-best-vs-cheapest-ratio"
quote = "the most expensive to run, by about 12x"
published = "12"
rows = "energy_gpu"
reduce = "ratio"
field = "marginal_j_per_doc"
where = { model_id = "qwen3-embedding:8b" }
against = { model_id = "bge-m3:latest" }
why = "marginal joules per document, qwen3-8b over bge-m3 on the same card"

[[claim]]
id = "selection-energy-qwen3-8b-joules"
quote = "costs 15.07 J per document against `bge-m3`'s 1.25"
published = "15.07"
rows = "energy_gpu"
reduce = "value"
field = "marginal_j_per_doc"
where = { model_id = "qwen3-embedding:8b" }
why = "qwen3-8b's marginal energy per document"

[[claim]]
id = "selection-energy-bge-m3-joules"
quote = "costs 15.07 J per document against `bge-m3`'s 1.25"
published = "1.25"
rows = "energy_gpu"
reduce = "value"
field = "marginal_j_per_doc"
where = { model_id = "bge-m3:latest" }
why = "bge-m3's marginal energy per document"

[[claim]]
id = "selection-energy-cpu-within-percent-of-gpu"
quote = "on the CPU is within 21 percent of it per document"
published = "21"
rows = "energy_cpu"
reduce = "percent_change"
field = "marginal_j_per_doc"
where = { provider = "sentence_transformers" }
against_rows = "energy_gpu"
against = { model_id = "bge-m3:latest" }
why = "how far the CPU MiniLM row sits above the cheapest GPU row, in percent of the GPU row"

[[claim]]
id = "selection-cloud-vs-electricity-floor"
quote = "5.5x for the cheapest API against the most expensive local option"
published = "5.5"
rows = "cloud"
reduce = "ratio"
field = "usd_per_million_tokens"
where = { provider = "openai", model = "text-embedding-3-small" }
against_rows = "energy_gpu"
against = { model_id = "qwen3-embedding:8b" }
against_field = "eur_per_million_docs_marginal"
scale = 348
why = "the cheapest list price per million documents at the gpt2 count of 348 tokens per document (cloud-prices.json tokens_per_document.by_tokenizer.gpt2, the lower of the two and the one the generated table's range starts at) over the most expensive local row's marginal electricity; USD over EUR, which the sentence says does not change the direction"

[[claim]]
id = "selection-cloud-vs-electricity-ceiling"
quote = "and 670x for the most expensive"
published = "670"
tolerance = 5
rows = "cloud"
reduce = "ratio"
field = "usd_per_million_tokens"
where = { provider = "gemini", model = "gemini-embedding-2" }
against_rows = "energy_gpu"
against = { model_id = "bge-m3:latest" }
against_field = "eur_per_million_docs_marginal"
scale = 348
why = "the most expensive list price at the same 348 tokens per document over the cheapest local row; the derivation gives 670.5 and the page rounds to the nearest ten, hence the tolerance"

[[claim]]
id = "selection-idle-cpu-low"
quote = "which on this box is 97 to 123 W"
published = "97"
rows = "energy_cpu"
reduce = "min"
field = "idle_w"
where = { provider = ["placeholder", "model2vec", "fastembed", "sentence_transformers"] }
why = "the lowest CPU package idle draw measured across the four CPU runs' interleaved idle windows"

[[claim]]
id = "selection-idle-cpu-high"
quote = "which on this box is 97 to 123 W"
published = "123"
rows = "energy_cpu"
reduce = "max"
field = "idle_w"
where = { provider = ["placeholder", "model2vec", "fastembed", "sentence_transformers"] }
why = "the highest of the same four"

[[claim]]
id = "selection-idle-gpu-low"
quote = "for the CPU package and 44 to 51 W for the card"
published = "44"
rows = "energy_gpu"
reduce = "min"
field = "idle_w"
where = { provider = "ollama" }
why = "the lowest card idle draw across the three GPU runs"

[[claim]]
id = "selection-idle-gpu-high"
quote = "for the CPU package and 44 to 51 W for the card"
published = "51"
rows = "energy_gpu"
reduce = "max"
field = "idle_w"
where = { provider = "ollama" }
why = "the highest of the same three"

[[claim]]
id = "selection-corpus-mean-document-bytes"
quote = "English medical abstracts averaging 1,639 bytes"
published = "1,639"
rows = "cloud_sample"
reduce = "value"
field = "mean_bytes_per_document"
where = { documents_sampled = 500 }
why = "the mean document size of the 500-document sample the per-document cloud prices were converted on; the energy runs each report their own sample's mean beside it"

# ---------------------------------------------------------------- heading markup on MLDR English

# The paired marked-minus-unmarked effect per strategy and embedder.
# The twin is a re-rendering of mldr_en_8k_slice, not a corpus of its own, so it never joins
# fit_corpora; it speaks only through this rowset.
[rowsets.mdstruct]
source = "markdown-structure-effect.json"
path = "effects"

[[claim]]
id = "selection-mdstruct-markdown"
quote = "splitter named for them: it cost `markdown` up to 0.018 nDCG@10"
published = "0.018"
rows = "mdstruct"
reduce = "max"
field = "mean_delta"
transform = "abs"
where = { strategy = "markdown" }
why = "the largest markdown loss to heading markup on the MLDR English twin, qwen3-embedding-4b's -0.0179"

[[claim]]
id = "selection-mdstruct-markdown-resolved"
quote = "nDCG@10, resolved for the two qwen3"
published = "two"
rows = "mdstruct"
reduce = "count"
where = { strategy = "markdown", resolved = true, embedding = ["ollama:qwen3-embedding-4b", "ollama:qwen3-embedding-8b"] }
why = "resolved markdown pairs on the twin, restricted to the qwen3 models; 03's mdstruct-headline-resolved pins that no other embedder resolves"
