# ---------------------------------------------------------------- why the tables are generated

[[claim]]
id = "method-drift-mariadb"
quote = "where the raw data says 0.6534/0.7933/0.8257"
published = "0.6534"
rows = "msmarco_scale"
reduce = "value"
field = "ndcg@10"
where = { store = "mariadb", scale = 250000 }
why = "mariadb's nDCG@10 on the MSMARCO 250,000-row run, the first of the three figures the retired text misquoted"

[[claim]]
id = "method-drift-pgvector"
quote = "where the raw data says 0.6534/0.7933/0.8257"
published = "0.7933"
rows = "msmarco_scale"
reduce = "value"
field = "ndcg@10"
where = { store = "pgvector", scale = 250000 }
why = "pgvector's nDCG@10 on the same run"

[[claim]]
id = "method-drift-sqlite-vec"
quote = "where the raw data says 0.6534/0.7933/0.8257"
published = "0.8257"
rows = "msmarco_scale"
reduce = "value"
field = "ndcg@10"
where = { store = "sqlite_vec", scale = 250000 }
why = "sqlite_vec's nDCG@10 on the same run"

[[claim]]
id = "method-drift-lancedb"
quote = "same repository's own numbers said 0.783"
