# Claims for docs/benchmarks/08-gaps.md
#
# Coverage is partial and is answered by reading this file beside the page, never by a green run.
# The gaps page restates figures from every other page, so most derivations here repeat one in
# that page's claim file; the `why` names the reading, not the twin. Seeded: the reranking depth
# and the store-cell sizes (1, 2); the span blind spot, corpus count, k and size ceiling (4); the
# frontier figures (5); the OmniDocBench recalls, page counts and DPI (6); the recursive
# throughput (7); the qwen3 instruction result (8); the memory ladder, sqlite_vec flatness, json
# per-chunk cost and lancedb regime change (9); the electricity and list-price ranges, the
# tokenizer spread and the idle draws (10); the metric-redundancy counts and views (11); the
# query-power medians, required counts, control shares, holdout precision and recall, the ladder
# counts and GerDaLIR's query multiple and overlap resolutions (12); and the chunking corrections
# restated in 13.
#
# Carried by prose the checker cannot express: directions ("every strategy got SLOWER", "keeps
# gaining down to its smallest rung"), rankings, "about a quarter" (13.8 of 51.3 points), "two and
# a half times tighter" (0.0352 over 0.0140), "fourfold" and "twofold" (whose denominators are the
# retired single-pass run), "83.7 percent" (one minus the worst Recall@10-against-P@1 disagreement
# rate, 0.163 on nfcorpus, which sits in a list nested inside each corpus row), the 1.24x holdout
# optimism (predicted over actually-resolved ties summed across eight rounds; 1.24 when seeded,
# 1.27 as a mean of per-round ratios) and "a half-width around 0.059" (the per-cell interval
# half-width averaged over the German cells, not the paired 0.0352), and "somewhere near 440,000
# chunks" (the generator's linear extrapolation of the json footprint to 8 GB).
#
# Carried by tests/benchmarks/baseline.json and the comparator, outside the raw directory (entries
# 2 and 3): the 150-document, 20-query gated slice, its 26 per-query cells, the +/-0.099
# half-width, the 0.03 and 0.005 thresholds, and the exact-store disagreement (pgvector differs
# from json on 4 of 20 queries at 0.6303, mariadb on 2 at 0.6054; json, sqlite_vec and lancedb
# agree on all 20 at 0.6207). The counts and the two current scores were re-derived from the
# baseline when this file was seeded; the earlier 0.6230 and 0.6182 are its history.
#
# Carried by git history only: the retired single-pass throughput run (13,749 docs/s, 0.53 s,
# 113 s, "within 7 percent"; bed889b), the retired driver-default store run ("up to 5.6 percent";
# 50d0a98). Not recorded anywhere: the reranker throughput (3.3 against 13.5 pairs per second),
# the RRF constant (a code default), the 200-chunk query depth, the 214 W wall reading, and the
# "about a fifth" of GerDaLIR queries over the window, which the page itself calls a one-off count.
# The cap512 re-cut figures (16 to 22 percent, 10 to 16 percent, "seven largest") describe the
# polluted sets the re-measure replaced; those sets were deleted, so the figures survive only in
# git history and the page quotes them as history.

doc = "docs/benchmarks/08-gaps.md"

[sets]
fit_corpora = ["gerdalir_de_12k_slice", "mldr_de_3k_slice", "mldr_en_8k_slice"]
# The metric-redundancy corpora with enough swept cells to carry a rank correlation: every corpus
# but cqadupstack (11 cells) and fiqa (4), which the page calls too thin to read.
metric_corpora_readable = ["miracl_de_100k_slice", "miracl_en_100k_slice", "mldr_de_3k_slice", "mldr_en_8k_slice", "nfcorpus", "scifact"]
metric_corpora_all = ["cqadupstack", "fiqa", "miracl_de_100k_slice", "miracl_en_100k_slice", "mldr_de_3k_slice", "mldr_en_8k_slice", "nfcorpus", "scifact"]
german_whitespace_sets = ["gerdalir_de_12k_slice__whitespace-t256-o0-gpt2", "mldr_de_3k_slice__whitespace-t256-o0-gpt2"]
late_sets = ["mldr_en_8k_slice__late-t256-o0-gpt2", "mldr_de_3k_slice__late-t256-o0-gpt2"]

[rowsets.effects]
source = "chunk-knob-effects.json"
path = "effects"
orient = true

[rowsets.rerank_cells]
source = "rerank-cross-encoder.json"
path = "cells"

[rowsets.quality]
source = "store-quality.json"
path = "cells"

[rowsets.frontier]
