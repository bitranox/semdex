id = "gap13-gerdalir-cap64-chunks"
quote = "(2,137,255 chunks at 64 on GerDaLIR)"
published = "2,137,255"
rows = "chunk_sets"
reduce = "value"
field = "rows"
where = { corpus = "gerdalir_de_12k_slice", profile = "recursive-t64-o0-gpt2" }
why = "chunk rows in the GerDaLIR cap64 set"

[[claim]]
id = "gap13-gerdalir-steps-count"
quote = "every one of the 18 steps favours the larger chunk"
published = "18"
rows = "effects"
reduce = "count"
where = { axis = "max_tokens", corpus = "gerdalir_de_12k_slice", "held_fixed.strategy" = "recursive" }
why = "every GerDaLIR recursive size comparison"

[[claim]]
id = "gap13-gerdalir-steps-all-larger"
quote = "every one of the 18 steps favours the larger chunk"
published = "18"
rows = "effects"
reduce = "count"
where = { axis = "max_tokens", corpus = "gerdalir_de_12k_slice", "held_fixed.strategy" = "recursive", resolved = true, favoured_end = "high" }
why = "of those, the ones resolved for the larger chunk; equal to the total, so every one"

