quote = "(13,749 -> 54,870"
published = "54,870"
rows = "throughput"
reduce = "value"
field = "docs_per_s"
where = { corpus = "nfcorpus (long docs)", strategy = "recursive", threads = 1 }
why = "recursive's repeated single-thread throughput on the long-document body; the 13,749 it replaced is the retired single-pass run"

# ---------------------------------------------------------------- 8. qwen3's instruction prefix

[[claim]]
id = "gaps-qwen3-instruction-queries"
quote = "paired over the same 323"
published = "323"
rows = "qwen3_4b_arms"
reduce = "value"
field = "query.queries"
where = { "plain.queries" = 323 }
why = "the query count every arm of the instruction measurement shares"

[[claim]]
id = "gaps-qwen3-4b-query-prefix-delta"
quote = "It is worth +0.0459"
published = "+0.0459"
rows = "qwen3_4b_paired"
reduce = "value"
field = "query_vs_plain/ndcg@10.mean_delta"
where = { "query_vs_plain/ndcg@10.resolved" = true }
why = "the 4B model's paired nDCG@10 gain from the query-side instruction"

[[claim]]
id = "gaps-qwen3-8b-query-prefix-delta"
quote = "nDCG@10 on the 4B and +0.0363 on the 8B, both resolved, which is 12.9 and 9.6 percent relative."
published = "+0.0363"
rows = "qwen3_8b_paired"
reduce = "value"
field = "query_vs_plain/ndcg@10.mean_delta"
where = { "query_vs_plain/ndcg@10.resolved" = true }
why = "the 8B model's paired nDCG@10 gain from the query-side instruction"

[[claim]]
id = "gaps-qwen3-4b-relative-gain"
quote = "nDCG@10 on the 4B and +0.0363 on the 8B, both resolved, which is 12.9 and 9.6 percent relative."
