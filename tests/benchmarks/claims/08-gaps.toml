published = "0.677"
rows = "frontier"
reduce = "min"
field = "recall_vs_exact"
where = { store = "mariadb", build_level = "driver default" }
why = "the lowest mariadb recall over its ef_search ladder on the default index"

[[claim]]
id = "gaps-frontier-mariadb-recall-high"
quote = "Recall sits at 0.677 to 0.684 across `ef_search`"
published = "0.684"
rows = "frontier"
reduce = "max"
field = "recall_vs_exact"
where = { store = "mariadb", build_level = "driver default" }
