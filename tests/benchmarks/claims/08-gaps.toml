published = "63"
rows = "frontier"
reduce = "min"
field = "search_p50_ms"
where = { store = "mariadb", build_level = "driver default" }
why = "the lowest mariadb p50 over its ef_search ladder"

[[claim]]
id = "gaps-frontier-mariadb-p50-high"
quote = "10 to 200 while latency rises from 63 ms to 76 ms"
published = "76"
rows = "frontier"
reduce = "max"
field = "search_p50_ms"
where = { store = "mariadb", build_level = "driver default" }
why = "the highest mariadb p50 over the same ladder"

