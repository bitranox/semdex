rows = "qwen3_4b_arms"
reduce = "percent_change"
field = "query.ndcg@10"
against_field = "plain.ndcg@10"
where = { "plain.queries" = 323 }
why = "the 4B query-prefixed arm's nDCG@10 against its plain arm"

[[claim]]
id = "gaps-qwen3-8b-relative-gain"
quote = "nDCG@10 on the 4B and +0.0363 on the 8B, both resolved, which is 12.9 and 9.6 percent relative."
