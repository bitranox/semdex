rows = "frontier"
reduce = "value"
field = "recall_vs_exact"
where = { store = "lancedb", query_level = "nprobes=40 refine=10" }
why = "lancedb's recall against exact at the strongest refine setting"

[[claim]]
id = "gaps-frontier-nprobes-5"
quote = "(0.561 at 5 probes, 0.567 at 80)"
published = "0.561"
rows = "frontier"
reduce = "value"
field = "recall_vs_exact"
where = { store = "lancedb", query_level = "nprobes=5" }
why = "lancedb recall at nprobes=5"

[[claim]]
id = "gaps-frontier-nprobes-80"
quote = "(0.561 at 5 probes, 0.567 at 80)"
published = "0.567"
rows = "frontier"
reduce = "value"
field = "recall_vs_exact"
where = { store = "lancedb", query_level = "nprobes=80" }
why = "lancedb recall at nprobes=80"

[[claim]]
id = "gaps-frontier-cell-rows"
quote = "**One cell**, 148,008 chunks at 768 dimensions"
published = "148,008"
rows = "frontier"
reduce = "max"
field = "rows"
where = { corpus = "mldr_en_8k_slice" }
why = "the frontier cell's chunk count"

[[claim]]
id = "gaps-frontier-cell-dim"
quote = "**One cell**, 148,008 chunks at 768 dimensions"
published = "768"
rows = "frontier"
reduce = "max"
field = "dim"
where = { corpus = "mldr_en_8k_slice" }
why = "the frontier cell's dimension"

[[claim]]
id = "gaps-frontier-mariadb-recall-low"
