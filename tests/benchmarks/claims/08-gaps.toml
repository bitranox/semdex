# ---------------------------------------------------------------- 1. retrieval method

[[claim]]
id = "gaps-rerank-depth"
quote = "`bge-reranker-base` over the top 20."
published = "20"
rows = "rerank_cells"
reduce = "max"
field = "rerank_depth"
where = { reranker = "BAAI/bge-reranker-base" }
why = "the shortlist depth every reranked cell was measured at"

# ---------------------------------------------------------------- 2. the composed store measurement

[[claim]]
id = "gaps-store-cells-english-chunks"
quote = "at 148,000 and 201,824 chunks"
published = "148,000"
rows = "quality"
reduce = "max"
field = "rows"
where = { corpus = "mldr_en_8k_slice" }
tolerance = 10
why = "the English cell's 148,008 chunks, rounded to the thousand on this page"

[[claim]]
id = "gaps-store-cells-german-chunks"
quote = "at 148,000 and 201,824 chunks"
published = "201,824"
rows = "quality"
reduce = "max"
field = "rows"
where = { corpus = "mldr_de_3k_slice" }
why = "the German cell's chunk count, the same on every store row of that corpus"

# ---------------------------------------------------------------- 4. chunk quality at span level

[[claim]]
id = "gaps-span-blind-spot"
quote = "up to 51 percent of queries scored as document hits deliver no whole answer"
published = "51"
rows = "span_retrieval"
reduce = "max"
field = "blind_spot"
where = { k = 5 }
scale = 100
why = "the largest blind spot in the composed measurement over every corpus and chunk size (GermanQuAD at 64 tokens, 51.3 percent)"

[[claim]]
id = "gaps-span-corpora"
quote = "**Four corpora, all Wikipedia-style prose, three languages.**"
published = "Four"
rows = "span_integrity"
reduce = "count"
where = { strategy = "recursive", max_tokens = 256, overlap_tokens = 0 }
why = "one integrity row per corpus at the recommended profile: GermanQuAD, XQuAD German, English and Spanish"

[[claim]]
id = "gaps-span-k"
quote = "k=5 with `fastembed:bge-base`"
published = "5"
rows = "span_retrieval"
reduce = "max"
field = "k"
where = { corpus = "germanquad" }
why = "the retrieval depth of the composed measurement, the same on every row"

[[claim]]
id = "gaps-span-size-ceiling"
quote = "and it now reaches 512 tokens"
published = "512"
rows = "span_retrieval"
reduce = "max"
field = "max_tokens"
where = { k = 5 }
why = "the largest chunk size the composed half was run at"

[[claim]]
id = "gaps-span-512-gain-low"
quote = "delivered-answer rate rises 3.9 to 7.4 points from 256 to 512"
published = "3.9"
rows = "span_retrieval"
reduce = "difference"
field = "span_hit"
scale = 100
where = { corpus = "xquad.de", max_tokens = 512, overlap_tokens = 0 }
against = { corpus = "xquad.de", max_tokens = 256, overlap_tokens = 0 }
why = "the smaller of the two German gains, XQuAD German"

[[claim]]
id = "gaps-span-512-gain-high"
quote = "delivered-answer rate rises 3.9 to 7.4 points from 256 to 512"
published = "7.4"
rows = "span_retrieval"
reduce = "difference"
field = "span_hit"
scale = 100
where = { corpus = "germanquad", max_tokens = 512, overlap_tokens = 0 }
against = { corpus = "germanquad", max_tokens = 256, overlap_tokens = 0 }
why = "the larger of the two German gains, GermanQuAD"

[[claim]]
id = "gaps-span-512-doc-cost-low"
quote = "1.3 to 3.6, so the reader's floor"
published = "1.3"
rows = "span_retrieval"
reduce = "difference"
field = "doc_hit"
scale = 100
where = { corpus = "xquad.de", max_tokens = 256, overlap_tokens = 0 }
against = { corpus = "xquad.de", max_tokens = 512, overlap_tokens = 0 }
why = "the smaller document-hit loss, XQuAD German; the page prints '1.3 to 3.6' on the next line"

[[claim]]
id = "gaps-span-512-doc-cost-high"
quote = "1.3 to 3.6, so the reader's floor"
published = "3.6"
rows = "span_retrieval"
reduce = "difference"
field = "doc_hit"
scale = 100
where = { corpus = "germanquad", max_tokens = 256, overlap_tokens = 0 }
against = { corpus = "germanquad", max_tokens = 512, overlap_tokens = 0 }
why = "the larger document-hit loss, GermanQuAD"

# ---------------------------------------------------------------- 5. the ANN frontier

[[claim]]
id = "gaps-frontier-lancedb-default-recall"
