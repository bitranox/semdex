# Claims for docs/benchmarks/05-vector-store.md
#
# Coverage is partial and is answered by reading this file beside the page, never by a green run.
# Seeded: the real-vector ladder's endpoints, ranges and speed advantage; the quality-through-the-
# store cost, doc recall, speed-up and control count; every frontier figure the tuning section
# quotes (cell size, lancedb's nprobes and refine ladders, pgvector's and mariadb's ranges, the
# matched-recall latencies, the build-time knobs and rebuild cost); the choosing section's exact-
# scan latencies; and the memory section's lancedb regime change.
#
# Carried by prose the checker cannot express: "monotonically" (a direction across a ladder),
# "flat from 20 upward", "less than a megabyte" (a spread, max minus min), and the advice
# thresholds ("below roughly 50,000", "above about 100,000"), which are recommendations rather than
# measurements. "Every point fetches 200 chunk hits" is the scorer's fetch depth and no raw file
# records it. `lance_index_threshold` defaults to 100,000 in the shipped config, not in a raw file.
#
# Carried by git history, not by any current raw file: the retired driver-default run of
# store-quality.json (commit 50d0a98) is what "this table used to say" quotes - 28 to 53 percent
# of documents missed, up to 5.6 percent of nDCG, 0.7974, 0.564, the 1.5 ms and the 5 to 8 percent
# latency the refine factor added, and the 0.0473 gap. Each was re-derived from that commit when
# this file was seeded; none can be gated here because the current raw carries only the re-measured
# cells.

doc = "docs/benchmarks/05-vector-store.md"

[sets]
# The dimensions the real-vector ladder reaches after the 1024 rung, for a claim "from 1024 upwards".
dims_from_1024 = [1024, 2048, 2560, 4096]
# Build-time settings other than the driver default, on the two server stores.
server_build_levels = ["m=8", "m=32", "m=8 ef_construction=32", "m=32 ef_construction=200"]

# The real-vector ladder: one row per (dim, scale), each holding a sqlite_vec and a lancedb table.
[rowsets.crossover]
source = "dim-crossover-real.json"
path = "results"

# Retrieval quality measured THROUGH a real store, one row per (corpus, embedding, store).
[rowsets.quality]
source = "store-quality.json"
path = "cells"

# The ANN frontier sweep: one row per (store, query_level, build_level) on one cached cell.
[rowsets.frontier]
source = "ann-frontier.json"
path = "points"

# Resident and ingest memory per (backend, rows) at 384 dimensions.
[rowsets.memory_stores]
source = "memory.json"
path = "stores"

# ---------------------------------------------------------------- exact against ANN, on real embeddings

[[claim]]
id = "store-exact-p50-smallest"
quote = "9.94 ms at 256 dimensions"
published = "9.94"
rows = "crossover"
reduce = "value"
field = "sqlite_vec.search_p50_ms"
where = { dim = 256, scale = 25000 }
why = "the exact scan's p50 at the ladder's smallest cell, 256 dimensions and 25,000 rows"

