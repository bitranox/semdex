# This workflow is PROJECT-OWNED and is NOT distributed by the CI template's
# distribute.sh. Unlike the default_*.yml workflows in this directory, it is
# not template-managed - it coexists with them the same way codeql.yml does.
# Do not fold this file into default_cicd_public.yml or hand it to the template.
#
# It runs the heavy local_only integration + benchmark tests (real embedding
# models, Docker-based extractor containers, SQL vector-store backends) that
# are deliberately excluded from the push/PR CI gate because they pull
# multi-GB images and download models. It is manual + weekly only.

name: Integration & Benchmarks

on:
  workflow_dispatch: {}
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  UV_LINK_MODE: "copy"

jobs:
  matrix-benchmark:
    # Retrieval quality across chunkers x embeddings, one job per corpus so the two run in
    # parallel. Downloads corpora via ir_datasets on first use - heavy, hence weekly/manual
    # only. Capped: the whole matrix over a full corpus (nfcorpus is 3,633 docs) does not
    # finish in 120 minutes on a 2-core runner - the 150-doc regression slice alone takes
    # 47 minutes there, about 31 of them in the quality matrix, so 300 docs is sized near
    # an hour. The store and embedding-model matrices run in regression-gate (nfcorpus).
    name: Retrieval benchmark matrix (${{ matrix.corpus }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        corpus: [nfcorpus, cqadupstack]
    env:
      SEMDEX_BENCH_CORPORA: ${{ matrix.corpus }}
      SEMDEX_BENCH_MAX_DOCS: "300"
      SEMDEX_BENCH_MAX_QUERIES: "50"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          prune-cache: false

      - name: Install dev + benchmark deps
        run: |
          uv pip install -e ".[dev,bench,pg,mariadb,model2vec,chunk,chunk-semantic,embed,ollama,docling,xberg,markitdown,mineru,sqlite,lance]" --system

      - name: Run retrieval benchmark matrix
        run: python -m pytest -p no:cacheprovider -o addopts="" -s tests/test_e2e_matrix.py::test_quality_matrix

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report-retrieval-${{ matrix.corpus }}
          path: benchmark-report.md
          if-no-files-found: warn

  regression-gate:
    # Reproducible regression check: runs a FIXED slice (small nfcorpus subsample +
    # text/markitdown extractors) so its metrics are comparable to the committed
    # baseline (tests/benchmarks/baseline.json), then diffs against it. Fails when a
    # cell stops working or a quality metric drops past tolerance. The fixed knobs
    # below MUST match the config the baseline was seeded with, or the comparison is
    # apples-to-oranges; see docs/BENCHMARKS.md ("Regression detection").
    name: Benchmark regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEMDEX_BENCH_CORPORA: nfcorpus
      SEMDEX_BENCH_MAX_DOCS: "150"
      SEMDEX_BENCH_MAX_QUERIES: "20"
      SEMDEX_BENCH_EXTRACTORS: text,markitdown
      # Only the embedding models a GitHub-hosted runner can load. The ollama models need
      # the LAN test rig, so here they would record "skip" and read as ok -> skip
      # regressions; left out, the comparator reports their baseline cells as "not run".
      # A model added to _EMBED_MODELS in tests/test_e2e_matrix.py must be added here too.
      SEMDEX_BENCH_EMBED_MODELS: "fastembed:bge-small,fastembed:bge-base,model2vec:potion-base-8M,model2vec:potion-retrieval-32M,st:all-MiniLM-L6-v2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          prune-cache: false

      - name: Install dev + benchmark deps
        run: |
          uv pip install -e ".[dev,bench,pg,mariadb,model2vec,chunk,chunk-semantic,embed,ollama,docling,xberg,markitdown,mineru,sqlite,lance]" --system

      - name: Run the fixed regression slice
        run: >-
          python -m pytest -p no:cacheprovider -o addopts="" -s
          tests/test_e2e_matrix.py
          tests/test_e2e_extractor_matrix.py::test_extractor_fixture_matrix

      - name: Compare against baseline (fails on regression)
        run: python scripts/benchmark_compare.py benchmark-results.json

      - name: Upload machine-readable results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-json
          path: benchmark-results.json
          if-no-files-found: warn

  real-adapters:
    # Exercises real (non-stub) adapters behind the ports: sentence-transformers
    # and local embeddings, real chunkers, and the pgvector/mariadb SQL vector
    # stores against live containers. Cells that need the private LAN test rig (real
    # ollama / llama.cpp servers, the persistent SQL test server) carry the lan_rig
    # marker and FAIL when it is unreachable, which a GitHub-hosted runner always is,
    # so this job deselects them; they run locally via `make ti`.
    name: Real adapters (embedding, chunker, SQL vector stores)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          prune-cache: false

      - name: Install dev + adapter deps
        run: |
          uv pip install -e ".[dev,bench,pg,mariadb,model2vec,chunk,chunk-semantic,embed,ollama,docling,xberg,markitdown,mineru,sqlite,lance]" --system

      - name: Run real adapter tests
        run: >-
          python -m pytest -p no:cacheprovider -o addopts="" -m "not lan_rig"
          tests/test_embedding_local.py tests/test_embedding_sentence_transformers.py
          tests/test_chunker_local.py tests/test_vectorstore_pgvector.py tests/test_vectorstore_mariadb.py
          tests/test_e2e_mcp_knowledge_matrix.py

  doc-extractors:
    # Exercises the HTTP document-extractor backends (docling/xberg/mineru),
    # each its own Docker container pulled and started by the tests - the
    # multi-GB image pulls this job is for. OmniDocBench stays off (research-only,
    # gated behind SEMDEX_BENCH_OMNIDOCBENCH, not set here).
    name: Document extractor matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEMDEX_BENCH_EXTRACT_CORPORA: fixtures,olmocr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          prune-cache: false

      - name: Install dev + extractor deps
        run: |
          uv pip install -e ".[dev,bench,pg,mariadb,model2vec,chunk,chunk-semantic,embed,ollama,docling,xberg,markitdown,mineru,sqlite,lance]" --system

      - name: Run document extractor tests
        run: >-
          python -m pytest -p no:cacheprovider -o addopts=""
          tests/test_extractor_docker.py tests/test_e2e_extractor_matrix.py

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report-extractor
          path: benchmark-report.md
          if-no-files-found: warn
